<!DOCTYPE html>
<html>
<head>
    <title>Clear Session</title>
    <style>
        body {
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0a0a0a;
            color: #00ff88;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 2px solid #00ff88;
            border-radius: 8px;
            background: #1a1a1a;
        }
        button {
            margin: 1rem;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-family: monospace;
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #00cc66;
        }
        .success {
            color: #00ff88;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clear Session Storage</h1>
        <p>Click the button below to clear your session</p>
        <button onclick="clearSession()">Clear Session</button>
        <div id="message"></div>
    </div>
    
    <script>
        function clearSession() {
            localStorage.removeItem('user');
            localStorage.removeItem('isGuest');
            localStorage.removeItem('sessionTimestamp');
            document.getElementById('message').innerHTML = '<div class="success">✓ Session cleared! You can close this page now.</div>';
        }
    </script>
</body>
</html>
