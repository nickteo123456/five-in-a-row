<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Connect Five</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: #04131a;
        color: #e8f4f6;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #19c8dc;
        color: #04131a;
        font: inherit;
        font-weight: 600;
      }
    </style>

  <body>
    <main>
      <h1>You're offline / 你已离线</h1>
      <p>Check your connection and try again. / 请检查网络后重试。</p>
      <button onclick="location.reload()">Try again / 重试</button>
    </main>
  </body>
</html>
